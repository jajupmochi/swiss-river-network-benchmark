[project]
name = "swissrivernetwork"
version = "0.1.0"
description = "Benchmarking Transformers on spatio-temporal river water temperature modeling across Swiss river networks."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Linlin Jia", email = "linlin.jia@unibe.ch" },
    { name = "Benjamin Fankhauser" },
]
maintainers = [
    { name = "Linlin Jia", email = "linlin.jia@unibe.ch" },
]
keywords = [
    "hydrology",
    "river-temperature",
    "benchmark",
    "transformer",
    "graph-neural-networks",
    "spatio-temporal",
    "pytorch",
    "pytorch-geometric",
    "time-series-forecasting",
    "switzerland",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA",
    "Framework :: Jupyter",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "halo>=0.0.31",
    "ipywidgets>=8.1.7",
    "kaleido>=1.1.0",
    "matplotlib>=3.10.6",
    "notebook>=7.4.5",
    "odfpy>=1.4.1",
    "pandas>=2.3.2",
    "pandas-stubs==2.3.2.250827",
    "plotly>=6.3.0",
    "python-benedict>=0.34.1",
    "ray[tune]>=2.49.1",
    "rich>=14.1.0",
    "scikit-image>=0.25.2",
    "scikit-learn>=1.7.1",
    "scipy-stubs~=1.16.1",
    "seaborn>=0.13.2",
    "tensorboard>=2.20.0",
    "torch>=2.8.0",
    "torch-geometric>=2.6.1",
    "torchinfo>=1.8.0",
    "transformers>=4.56.2",
    "typer>=0.12.0",
    "wandb>=0.21.3",
]

[project.optional-dependencies]
# Interactive demos — Gradio (Hugging Face Space) and Streamlit (local UI).
app = [
    "gradio>=5.0.0",
    "streamlit>=1.38.0",
    "altair>=5.4.0",
    "folium>=0.16.0",
    "joblib>=1.3.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.0",
    "pyarrow>=15.0.0",
]
# Documentation site (MkDocs Material + mkdocstrings + jupyter + i18n + mike).
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.26.0",
    "mkdocs-jupyter>=0.25.0",
    "mkdocs-static-i18n>=1.2.0",
    "mkdocs-glightbox>=0.4.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.6",
    "mike>=2.1.0",
    "pymdown-extensions>=10.11",
]
# Development tooling (lint, test, notebook execution, pre-commit).
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
    "nbmake>=1.5.0",
    "ruff>=0.15.11",
    "pre-commit>=3.8.0",
]
# Desktop-app packaging (PyInstaller bundle).
dist = [
    "pyinstaller>=6.10.0",
]
# Convenience target that pulls in everything.
all = [
    "swissrivernetwork[app,docs,dev,dist]",
]

[project.urls]
Homepage = "https://github.com/jajupmochi/swiss-river-network-benchmark"
Repository = "https://github.com/jajupmochi/swiss-river-network-benchmark"
Documentation = "https://jajupmochi.github.io/swiss-river-network-benchmark/"
Issues = "https://github.com/jajupmochi/swiss-river-network-benchmark/issues"
Changelog = "https://github.com/jajupmochi/swiss-river-network-benchmark/blob/main/CHANGELOG.md"
Discussions = "https://github.com/jajupmochi/swiss-river-network-benchmark/discussions"
"Hugging Face Space" = "https://huggingface.co/spaces/jajupmochi/swiss-river-network-benchmark"

[project.scripts]
srn = "swissrivernetwork.cli:main"
swissrivernetwork = "swissrivernetwork.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swissrivernetwork"]

[tool.hatch.build.targets.sdist]
include = [
    "swissrivernetwork/**",
    "README.md",
    "README.*.md",
    "LICENSE",
    "CITATION.cff",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "SECURITY.md",
    "pyproject.toml",
]
exclude = [
    "swissrivernetwork/benchmark/outputs",
    "swissrivernetwork/benchmark/dump",
    "swissrivernetwork/benchmark/wandb",
    "swissrivernetwork/benchmark/visualize_results/outputs",
    "swissrivernetwork/benchmark/visualize_results/figures",
    "swissrivernetwork/benchmark/visualize_results/.gradio",
    "swissrivernetwork/benchmark/visualize_results/.ipynb_checkpoints",
    "tests/**/__pycache__",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "playground",
    "rrpr2026",  # paper sources + vendored third-party reference code (not project source)
    "swissrivernetwork/benchmark/test.py",
    "swissrivernetwork/benchmark/test2.py",
    "swissrivernetwork/benchmark/outputs",
    "swissrivernetwork/benchmark/dump",
    "*.ipynb",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F403", "F405"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
filterwarnings = [
    "ignore::DeprecationWarning:ray.*",
    "ignore::DeprecationWarning:torch.*",
]

[dependency-groups]
dev = [
    "nbmake>=1.5.0",
    "pre-commit>=3.8.0",
    "pytest>=8.4.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.15.11",
]
