<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Swiss River Network Benchmark — social card">
  <title>Swiss River Network Benchmark</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="temp" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- river graph -->
  <g transform="translate(40 120)" fill="none" stroke="url(#river)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 200 C 180 140, 240 320, 380 340 S 580 380, 700 240"/>
    <path d="M380 340 C 380 440, 480 480, 600 470"/>
    <path d="M200 260 C 180 360, 120 400, 100 470"/>
  </g>
  <g transform="translate(40 120)" stroke="#0f172a" stroke-width="4">
    <circle cx="40"  cy="200" r="13" fill="#38bdf8"/>
    <circle cx="200" cy="260" r="13" fill="#60a5fa"/>
    <circle cx="380" cy="340" r="16" fill="#818cf8"/>
    <circle cx="700" cy="240" r="13" fill="#c084fc"/>
    <circle cx="600" cy="470" r="13" fill="#f472b6"/>
    <circle cx="100" cy="470" r="13" fill="#f59e0b"/>
  </g>

  <!-- thermometer -->
  <g transform="translate(820 100)">
    <rect x="0" y="0" width="46" height="320" rx="23" ry="23" fill="#020617" stroke="#e2e8f0" stroke-width="3"/>
    <rect x="12" y="26" width="22" height="260" rx="11" ry="11" fill="url(#temp)"/>
    <circle cx="23" cy="350" r="40" fill="url(#temp)" stroke="#e2e8f0" stroke-width="3"/>
  </g>

  <!-- text -->
  <g font-family="'Inter','Helvetica Neue',Arial,sans-serif" fill="#e2e8f0">
    <text x="40"  y="90" font-size="44" font-weight="800" letter-spacing="2">SWISS RIVER NETWORK BENCHMARK</text>
    <text x="40"  y="560" font-size="34" font-weight="600" fill="#e2e8f0">Benchmarking Transformers on Spatio-Temporal</text>
    <text x="40"  y="600" font-size="34" font-weight="600" fill="#e2e8f0">River Water Temperature Modeling</text>
    <text x="930" y="580" font-size="22" font-weight="500" fill="#94a3b8" text-anchor="end">ICPR 2026 · MIT</text>
  </g>
</svg>
